# 아이폰·PC 친구용 웹 버전: main에 올리면 자동으로 빌드해서 GitHub Pages에 올려요
name: Web (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    env:
      # 공개용 키라 코드에 넣어도 괜찮아요. 권한은 Supabase RLS가 지켜요.
      VITE_SUPABASE_URL: https://ofddzgicbvogshfzfmbo.supabase.co
      VITE_SUPABASE_KEY: sb_publishable_QM_sKn_I7B3vB15eHRriQg_p6RAfKab
      VITE_WEB_URL: https://niaxcroknit.github.io/kungjjak
      VITE_STORE_URL: ${{ vars.STORE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: d
        uses: actions/deploy-pages@v4
